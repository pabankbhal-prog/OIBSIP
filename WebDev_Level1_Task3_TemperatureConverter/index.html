<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Temperature Converter | Paban Kumar Bhal</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="container">

        <h1>
            <i class="fas fa-temperature-half"></i>
            Temperature Converter
        </h1>

        <p class="subtitle">
            Convert temperatures between Celsius, Fahrenheit and Kelvin instantly.
        </p>

        <div class="converter">

            <div class="input-group">

                <label>Enter Temperature</label>

                <input
                    type="number"
                    id="temperature"
                    placeholder="Enter value">

            </div>

            <div class="row">

                <div class="input-group">

                    <label>From</label>

                    <select id="fromUnit">

                        <option value="C">Celsius (°C)</option>

                        <option value="F">Fahrenheit (°F)</option>

                        <option value="K">Kelvin (K)</option>

                    </select>

                </div>

                <div class="input-group">

                    <label>To</label>

                    <select id="toUnit">

                        <option value="F">Fahrenheit (°F)</option>

                        <option value="C">Celsius (°C)</option>

                        <option value="K">Kelvin (K)</option>

                    </select>

                </div>

            </div>

            <div class="buttons">

                <button id="convertBtn">

                    Convert

                </button>

                <button id="resetBtn">

                    Reset

                </button>

            </div>

            <div class="result">

                <h2>Result</h2>

                <p id="resultText">

                    Your converted temperature will appear here.

                </p>

            </div>

        </div>

    </div>

    <footer>

        © 2026 Paban Kumar Bhal | Oasis Infobyte Internship

    </footer>

    <script src="script.js"></script>

</body>

</html>
